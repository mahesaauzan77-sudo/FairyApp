name: FAIRY Android Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libssl-dev libffi-dev

      - name: Install Buildozer
        run: pip install buildozer cython virtualenv

      - name: Buat Script Utama & Config
        run: |
          # Jika file fairy_app.py ada, salin jadi main.py. Jika tidak, buat template aman.
          if [ -f fairy_app.py ]; then
            cp fairy_app.py main.py
          elif [ ! -f main.py ]; then
            echo "from kivy.app import App" > main.py
            echo "from kivy.uix.label import Label" >> main.py
            echo "class FairyApp(App):" >> main.py
            echo "    def build(self): return Label(text='FAIRY')" >> main.py
            echo "if __name__ == '__main__': FairyApp().run()" >> main.py
          fi
          
          yes | buildozer init
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,pyjnius/g' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK ke HP Master
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-FAIRY
          path: bin/*.apk
